name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run scripts/check-versions.py
      - run: uv build
      - name: Verify built wheel
        run: |
          wheel=$(printf '%s\n' dist/*.whl)
          uv run --isolated --no-project --with "$wheel" python -c \
            'import hexaloom, importlib.resources; assert importlib.resources.files(hexaloom).joinpath("py.typed").is_file()'

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - run: cargo test --workspace --doc --locked
