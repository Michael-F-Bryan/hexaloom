name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      # Events created with GITHUB_TOKEN do not start ordinary downstream
      # workflows. workflow_dispatch is an explicit exception.
      - name: Publish the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run cd.yml --ref "$TAG" --field tag="$TAG"
